[package]
name = "keyfold-cli"
version = "1.0.0"
description = "Keyfold command line and MCP server"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "keyfold"
path = "src/main.rs"

[dependencies]
keyfold-agent = { path = "../keyfold-agent" }
keyfold-core = { path = "../keyfold-core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = { version = "1", features = ["derive"] }
