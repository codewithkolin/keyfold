[package]
name = "keyfold-core"
version = "0.1.0"
description = "Keyfold vault core: encryption, file format, data model, licence verification"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "keyfold_core"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
sha1 = "0.11"
regex = "1"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
ed25519-dalek = "3"

[dev-dependencies]
tempfile = "3"
